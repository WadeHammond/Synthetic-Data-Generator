# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: synthetic-data-generator
metadata:
  template: synthetic-data-generator@0.0.1
services:
  web:
    project: .
    language: docker
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .
      # Build the image in Azure Container Registry (ACR Tasks) instead of locally,
      # so no local Docker daemon is required for `azd up`.
      remoteBuild: true
